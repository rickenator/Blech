name: Build ESP32-S3 firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache ESP-IDF
        id: cache-idf
        uses: actions/cache@v4
        with:
          path: |
            ~/esp
            ~/.espressif
          key: esp-idf-v5.4-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Install ESP-IDF
        if: steps.cache-idf.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0
          mkdir -p ~/esp
          cd ~/esp
          git clone --depth 1 --branch v5.4 --recursive https://github.com/espressif/esp-idf.git
          cd esp-idf
          ./install.sh esp32s3

      - name: Generate dev certificate
        run: |
          ./tools/generate-dev-cert.sh

      - name: Build firmware
        run: |
          . ~/esp/esp-idf/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp build/blech.bin dist/
          cp build/bootloader/bootloader.bin dist/
          cp build/partition_table/partition-table.bin dist/
          cp partitions.csv dist/
          # Flash script
          cat > dist/flash.sh << 'FSCRIPT'
          #!/bin/sh
          set -eu
          PORT="${1:-/dev/ttyACM0}"
          BAUD="${2:-460800}"
          python3 -m esptool --chip esp32s3 -p "$PORT" -b "$BAUD" \
            --before default_reset --after hard_reset write_flash \
            --flash_mode dio --flash_size 16MB --flash_freq 80m \
            0x0 bootloader.bin \
            0x8000 partition-table.bin \
            0x10000 blech.bin
          FSCRIPT
          chmod +x dist/flash.sh
          # Write release notes snippet
          echo "Firmware: \`blech.bin\` at offset \`0x10000\`" > dist/RELEASE.txt
          echo "Bootloader + partition table included." >> dist/RELEASE.txt
          echo "" >> dist/RELEASE.txt
          echo "Model (\`model.bin\`) must be flashed separately to \`0x150000\`." >> dist/RELEASE.txt
          echo "Download the model from the GitHub Release assets." >> dist/RELEASE.txt
          # Generate checksums
          cd dist && sha256sum *.bin flash.sh > SHA256SUMS && cd ..

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: blech-firmware
          path: dist/
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: blech-firmware
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Blech ${{ github.ref_name }}"
          body_path: dist/RELEASE.txt
          files: |
            dist/blech.bin
            dist/bootloader.bin
            dist/partition-table.bin
            dist/flash.sh
            dist/SHA256SUMS
          generate_release_notes: true

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171714">
  <title>Please Wait &mdash; FormClerk-9</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #171714;
      --panel: #23231f;
      --panel-strong: #30302a;
      --text: #faf9f2;
      --muted: #b9b8ae;
      --line: #46463e;
      --accent: #ffb454;
      --accent-ink: #261700;
      --error: #ff9b8e;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--page); color: var(--text);
      font: 18px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, textarea { font: inherit; }
    .app {
      width: min(100%, 48rem); min-height: 100dvh; margin: 0 auto;
      display: grid; grid-template-rows: auto 1fr auto;
    }
    header {
      padding: max(1rem, env(safe-area-inset-top)) 1rem 0.85rem;
      border-bottom: 1px solid var(--line);
    }
    h1 {
      margin: 0; font-size: clamp(1.45rem, 6vw, 1.85rem);
      line-height: 1.15; letter-spacing: -0.02em;
    }
    .status {
      display: flex; align-items: center; gap: 0.55rem;
      margin-top: 0.55rem; color: var(--muted); font-size: 0.9rem;
    }
    .status::before {
      content: ""; width: 0.7rem; height: 0.7rem; flex: 0 0 auto;
      border-radius: 50%; background: var(--accent);
    }
    .status.ready::before { background: #70d98b; }
    .status.error { color: var(--error); }
    .status.error::before { background: var(--error); }
    #messages {
      min-height: 0; overflow-y: auto; padding: 1.25rem 1rem 2rem;
      scroll-behavior: smooth;
    }
    .message {
      width: fit-content; max-width: 88%; margin: 0 0 1rem;
      padding: 0.8rem 1rem; border-radius: 1rem;
      white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .assistant { background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 0.3rem; }
    .user { margin-left: auto; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 0.3rem; }
    form {
      display: grid; grid-template-columns: 1fr auto; gap: 0.65rem;
      padding: 0.8rem 1rem max(0.8rem, env(safe-area-inset-bottom));
      background: var(--page); border-top: 1px solid var(--line);
    }
    textarea {
      width: 100%; min-height: 3.35rem; max-height: 9rem; resize: vertical;
      padding: 0.72rem 0.85rem; border: 1px solid var(--line);
      border-radius: 0.8rem; background: var(--panel); color: var(--text);
    }
    textarea:focus { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); border-color: var(--accent); }
    button {
      min-height: 3.35rem; padding: 0.65rem 1rem; border: 0;
      border-radius: 0.8rem; background: var(--accent); color: var(--accent-ink); font-weight: 750;
    }
    button:disabled { opacity: 0.5; }
    .hint { grid-column: 1 / -1; margin: -0.15rem 0 0; color: var(--muted); font-size: 0.78rem; }
    @media (max-width: 28rem) {
      body { font-size: 19px; }
      .message { max-width: 94%; }
      form { grid-template-columns: 1fr; }
      .send { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header><h1>Please Wait</h1><div class="status" id="statusLine">Loading…</div></header>
    <div id="messages"></div>
    <form id="form">
      <textarea id="prompt" rows="1" placeholder="Say something…" autofocus></textarea>
      <div><button type="submit" id="send" class="send">Send</button><p class="hint">Shift+Enter for new line</p></div>
    </form>
  </main>

  <script>
    const messages = document.querySelector("#messages");
    const promptNode = document.querySelector("#prompt");
    const sendButton = document.querySelector("#send");
    const statusLine = document.querySelector("#statusLine");
    const history = [];

    function addMessage(text, kind) {
      const msg = document.createElement("div");
      msg.className = "message " + kind;
      msg.textContent = text;
      messages.appendChild(msg);
      messages.scrollTop = messages.scrollHeight;
      return msg;
    }

    async function pollStatus() {
      try {
        const resp = await fetch("/api/status");
        const data = await resp.json();
        const mode = data.mode === "local" ? "Local" : data.mode === "lan" ? "LAN" : "Auto";
        statusLine.textContent = data.ready ? mode + " agent ready" : data.status;
        statusLine.className = "status " + (data.ready ? "ready" : "error");
      } catch { statusLine.textContent = "Offline"; statusLine.className = "status error"; }
    }

    async function sendMessage() {
      const prompt = promptNode.value.trim();
      if (!prompt || sendButton.disabled) return;
      addMessage(prompt, "user");
      history.push({ role: "user", content: prompt });
      promptNode.value = "";
      sendButton.disabled = true;
      promptNode.disabled = true;
      const reply = addMessage("", "assistant");
      let fullText = "";
      try {
        const resp = await fetch("/api/chat/stream", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history })
        });
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          fullText += decoder.decode(value, { stream: true });
          reply.textContent = fullText;
          messages.scrollTop = messages.scrollHeight;
        }
        if (resp.ok) history.push({ role: "assistant", content: fullText });
      } catch {
        reply.textContent = "Connection lost.";
      }
      sendButton.disabled = false;
      promptNode.disabled = false;
      promptNode.focus();
    }

    document.querySelector("#form").addEventListener("submit", e => { e.preventDefault(); sendMessage(); });
    promptNode.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.querySelector("#form").requestSubmit(); }
    });

    pollStatus();
    setInterval(pollStatus, 5000);
  </script>
</body>
</html>
